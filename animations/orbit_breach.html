<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orbit Breach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed canvas with a 3D particle ring seen from above; one quiet control strip pinned bottom-left. Single committed light look. */
:root {
  --bg: #ffffff;
  --dot: 12, 12, 14;         /* rgb triplet for dots */
  --red: 232, 64, 92;        /* rgb triplet for attack arcs */
  --fg: #1a1b1f;
  --muted: #7a7d86;
  --panel: rgba(255, 255, 255, 0.82);
  --line: rgba(0, 0, 0, 0.10);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--mono); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: fixed;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  display: grid; max-width: 920px; gap: 10px;
  pointer-events: none;
}
.hud-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.panel {
  pointer-events: auto;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 14px; backdrop-filter: blur(10px); font-size: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.06);
}
.settings-panel {
  pointer-events: auto; display: grid; width: min(100%, 900px);
  grid-template-columns: repeat(2, minmax(250px, 1fr)); gap: 14px 24px;
  padding: 16px 18px; border: 1px solid var(--line); border-radius: 18px;
  background: var(--panel); box-shadow: 0 12px 30px rgba(0,0,0,.08); backdrop-filter: blur(10px);
}
.stat { color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; font-variant-numeric: tabular-nums; }
.stat b { color: var(--fg); font-weight: 500; }
.stat b.hot { color: rgb(var(--red)); }
button {
  font: inherit; font-size: 12px; color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
button:hover { border-color: rgba(0,0,0,.3); }
button[aria-expanded] { min-width: 108px; }
button:focus-visible, input:focus-visible { outline: 2px solid rgb(var(--red)); outline-offset: 2px; }
.slider-control { display: grid; grid-template-columns: minmax(82px, auto) 1fr 5ch; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.slider-control > span { white-space: nowrap; }
input[type=range] {
  appearance: none; -webkit-appearance: none; width: 100%; min-width: 90px; height: 24px;
  margin: 0; background: transparent; cursor: pointer; touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: rgba(0,0,0,.14); }
input[type=range]::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none; width: 17px; height: 17px; margin-top: -6.5px;
  border: 2px solid #fff; border-radius: 50%; background: rgb(var(--red)); box-shadow: 0 1px 5px rgba(var(--red),.45);
}
input[type=range]::-moz-range-track { height: 4px; border: 0; border-radius: 999px; background: rgba(0,0,0,.14); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 999px; background: rgba(var(--red),.72); }
input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border: 2px solid #fff; border-radius: 50%; background: rgb(var(--red)); box-shadow: 0 1px 5px rgba(var(--red),.45); }
.val { justify-self: end; color: var(--fg); min-width: 5ch; font-variant-numeric: tabular-nums; text-align: right; text-transform: none; letter-spacing: 0; }
@media (max-width: 680px) {
  .hud { left: calc(10px + env(safe-area-inset-left, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .hud-bar { gap: 7px; }
  .panel { gap: 7px 10px; padding: 6px 10px; }
  .settings-panel { max-height: min(54vh, 390px); padding: 14px; grid-template-columns: 1fr; gap: 8px; overflow-y: auto; }
  .slider-control { grid-template-columns: 86px minmax(90px, 1fr) 5ch; gap: 7px; }
}
</style>

<canvas id="c" aria-label="Animated 3D ring of orbiting dots where red arcs show one compromised node attacking the next"></canvas>

<div class="hud">
  <div class="hud-bar">
    <div class="panel">
      <span class="stat">Nodes <b id="nNodes">0</b></span>
      <span class="stat">Compromised <b id="nHit" class="hot">0</b></span>
      <span class="stat">Active arcs <b id="nArcs">0</b></span>
    </div>
    <div class="panel">
      <button id="pause" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
      <button id="toggleSliders" type="button" aria-controls="sliderPanel" aria-expanded="true">Hide sliders</button>
    </div>
  </div>
  <div class="settings-panel" id="sliderPanel">
    <label class="slider-control" for="speed"><span>Speed</span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"><output id="speedOut" class="val">1.00×</output></label>
    <label class="slider-control" for="tilt"><span>Tilt</span><input id="tilt" type="range" min="10" max="60" step="1" value="24"><output id="tiltOut" class="val">24°</output></label>
    <label class="slider-control" for="reach"><span>Reach</span><input id="reach" type="range" min="0.3" max="2.5" step="0.1" value="1"><output id="reachOut" class="val">1.0×</output></label>
    <label class="slider-control" for="speedReach"><span>Speed boost</span><input id="speedReach" type="range" min="0" max="1" step="0.05" value="0.45"><output id="speedReachOut" class="val">0.45</output></label>
    <label class="slider-control" for="maxArcs"><span>Max arcs</span><input id="maxArcs" type="range" min="10" max="510" step="10" value="30"><output id="maxArcsOut" class="val">30</output></label>
    <label class="slider-control" for="double"><span>Double attack</span><input id="double" type="range" min="0" max="1" step="0.01" value="0.18"><output id="doubleOut" class="val">18%</output></label>
    <label class="slider-control" for="balance"><span>Balance</span><input id="balance" type="range" min="0" max="6" step="0.25" value="2"><output id="balanceOut" class="val">2.0</output></label>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const css = getComputedStyle(document.documentElement);
  const DOT = css.getPropertyValue('--dot').trim();
  const RED = css.getPropertyValue('--red').trim();
  const BG = css.getPropertyValue('--bg').trim();

  // ---- tunables ----
  const ARC_TRAVEL = 1.0;      // seconds for an arc to reach its victim
  const DWELL = [0.3, 1.0];    // victim waits this long before attacking
  const FADE = 1.3;            // arc fade-out after the victim strikes back
  let DOUBLE_P = 0.18;         // chance an attacker hits 2 victims (slider)
  let MAX_ARCS = 30;           // cap on arcs on screen; Infinity = no cap (slider)
  const HEAL = 8;              // seconds a compromised dot stays red
  const ALPHA_BUCKETS = 10;

  let W, H, DPR, cx, cy, S, FOCAL = 3.2;
  let tiltDeg = 24;
  let N = 0, phi, rr, yy, omg, sz, px, py, pa, ps, hitAt;
  let attacks = [], pending = [], incoming = new Map();
  const reserved = new Set();
  let t = 0, last = performance.now(), paused = false;
  let speed = reduced ? 0.4 : 1, speedVal = 1;
  let reachVal = 1, speedBoost = 0.45, balanceVal = 2;
  let hitCount = 0, idleSince = 0;
  let buckets = [];

  const gauss = () => {
    let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  function build() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H * 0.56;
    S = Math.min(W * 0.46, H * 1.1); // ring radius in px

    N = Math.round(Math.min(32000, Math.max(9000, (W * H) / 45)));
    phi = new Float32Array(N); rr = new Float32Array(N); yy = new Float32Array(N);
    omg = new Float32Array(N); sz = new Float32Array(N);
    px = new Float32Array(N); py = new Float32Array(N); pa = new Float32Array(N); ps = new Float32Array(N);
    hitAt = new Float32Array(N).fill(-1e9);

    for (let i = 0; i < N; i++) {
      // thick ring (torus-like), gaussian cross-section with a soft long tail
      const wide = Math.random() < 0.25 ? 2.2 : 1;
      rr[i] = 1 + gauss() * 0.11 * wide;
      yy[i] = gauss() * 0.075 * wide;
      phi[i] = Math.random() * Math.PI * 2;
      // inner particles orbit a little faster
      omg[i] = (0.16 / Math.pow(rr[i], 1.5)) * (0.9 + Math.random() * 0.2);
      const r = Math.random();
      sz[i] = r < 0.04 ? 2.6 : r < 0.25 ? 1.6 : 1;
    }
    buckets = Array.from({ length: ALPHA_BUCKETS }, () => []);
    attacks = []; pending = []; incoming.clear(); reserved.clear(); hitCount = 0;
    document.getElementById('nNodes').textContent = N.toLocaleString();
    project();
    seed();
  }

  function project() {
    const tl = tiltDeg * Math.PI / 180, ct = Math.cos(tl), st = Math.sin(tl);
    for (let b of buckets) b.length = 0;
    for (let i = 0; i < N; i++) {
      const x = rr[i] * Math.cos(phi[i]);
      const z = rr[i] * Math.sin(phi[i]);   // +z = far side
      const y = yy[i];
      // camera above the ring plane, looking slightly down
      const sy = y * ct + z * st;           // far side rises on screen
      const depth = z * ct - y * st;        // + = farther away
      const k = FOCAL / (FOCAL + depth);
      px[i] = cx + x * S * k;
      py[i] = cy - sy * S * k;
      // near half fades to nothing, far half stays dark
      const f = Math.min(1, Math.max(0, (depth + 0.55) / 1.0));
      const a = Math.pow(f, 1.6);
      pa[i] = a;
      ps[i] = sz[i] * (0.75 + 0.35 * k);
      if (a > 0.02) buckets[Math.min(ALPHA_BUCKETS - 1, (a * ALPHA_BUCKETS) | 0)].push(i);
    }
  }

  const visible = i => pa[i] > 0.45 && px[i] > 20 && px[i] < W - 20 && py[i] > 20 && py[i] < H - 70;
  const healthy = i => t - hitAt[i] > HEAL + 2;

  function pickVictim(a) {
    // reach grows with the speed slider so fast chains cross the whole ring
    // Reach = base range; Speed boost = how much faster speeds stretch it
    const reach = reachVal * (1 + speedBoost * (speedVal - 1)) * 0.66;
    const maxD = S * Math.max(0.15, Math.min(2.4, reach));
    const minD = Math.min(maxD * 0.5, 40 + 40 * reachVal * Math.max(1, speedVal * speedBoost * 2));

    // which side currently has more red? lean the next strike the other way
    let lean = 0;
    for (const atk of attacks) lean += (px[atk.v] - cx) / S;
    lean = attacks.length ? lean / attacks.length : 0;

    let best = -1, bestScore = -Infinity, found = 0;
    for (let k = 0; k < 1500 && found < 8; k++) {
      const j = (Math.random() * N) | 0;
      if (j === a || !healthy(j) || reserved.has(j) || !visible(j)) continue;
      const d = Math.hypot(px[j] - px[a], py[j] - py[a]);
      if (d < minD || d > maxD) continue;
      found++;
      const side = (px[j] - cx) / S;                   // -1 left .. +1 right
      const score = -side * lean * balanceVal + Math.random();  // favour the emptier side
      if (score > bestScore) { bestScore = score; best = j; }
    }
    return best;
  }

  function seed() {
    for (let k = 0; k < 800; k++) {
      const j = (Math.random() * N) | 0;
      if (visible(j) && healthy(j)) { infect(j); pending.push({ who: j, at: t + 0.4 }); return; }
    }
  }

  function infect(i) { if (healthy(i)) hitCount++; hitAt[i] = t; }

  function launch(a) {
    const n = (Math.random() < DOUBLE_P && attacks.length < MAX_ARCS * 0.7) ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const v = pickVictim(a);
      if (v < 0) continue;
      attacks.push({ a, v, t0: t, bend: (Math.random() < 0.5 ? -1 : 1) * (0.08 + Math.random() * 0.14), landed: false, fade: -1 });
      reserved.add(v);
    }
  }

  function step(dt) {
    t += dt;
    for (let i = 0; i < N; i++) phi[i] += omg[i] * dt;

    for (let k = pending.length - 1; k >= 0; k--) {
      if (pending[k].at <= t) {
        const { who } = pending[k];
        pending.splice(k, 1);
        if (attacks.length < MAX_ARCS) launch(who);
      }
    }
    for (const atk of attacks) {
      if (!atk.landed && t - atk.t0 >= ARC_TRAVEL) {
        atk.landed = true;
        reserved.delete(atk.v);
        infect(atk.v);
        const prev = incoming.get(atk.a);          // arc that hit this attacker
        if (prev && prev.fade < 0) prev.fade = t;  // fades once it strikes back
        incoming.set(atk.v, atk);
        pending.push({ who: atk.v, at: t + DWELL[0] + Math.random() * (DWELL[1] - DWELL[0]) });
      }
      if (atk.landed && atk.fade < 0 && t - atk.t0 > ARC_TRAVEL + 4) atk.fade = t;
    }
    attacks = attacks.filter(a => {
      const dead = a.fade >= 0 && t - a.fade > FADE;
      if (dead) a.gone = true;
      return !dead;
    });
    for (const [v, a] of incoming) if (a.gone) incoming.delete(v);

    if (attacks.length === 0 && pending.length === 0) {
      if (!idleSince) idleSince = t;
      if (t - idleSince > 0.8) { idleSince = 0; seed(); }
    } else idleSince = 0;
    if (Math.random() < dt * 0.05 && attacks.length < MAX_ARCS * 0.4) seed();
  }

  function bez(x0, y0, x1, y1, bend, s) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const dx = x1 - x0, dy = y1 - y0;
    const qx = mx - dy * bend, qy = my + dx * bend;
    const u = 1 - s;
    return [u*u*x0 + 2*u*s*qx + s*s*x1, u*u*y0 + 2*u*s*qy + s*s*y1];
  }

  function draw() {
    project();
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // dots, batched by opacity
    for (let b = 0; b < ALPHA_BUCKETS; b++) {
      const list = buckets[b];
      if (!list.length) continue;
      ctx.fillStyle = `rgba(${DOT},${((b + 0.5) / ALPHA_BUCKETS) * 0.9})`;
      for (let n = 0; n < list.length; n++) {
        const i = list[n];
        const s = ps[i];
        ctx.fillRect(px[i] - s / 2, py[i] - s / 2, s, s);
      }
    }

    // arcs
    ctx.lineCap = 'round';
    for (const atk of attacks) {
      const { a, v, bend } = atk;
      const prog = Math.min(1, (t - atk.t0) / ARC_TRAVEL);
      const ease = 1 - Math.pow(1 - prog, 3);
      let alpha = 0.85;
      if (atk.fade >= 0) alpha *= Math.max(0, 1 - (t - atk.fade) / FADE);
      const x0 = px[a], y0 = py[a], x1 = px[v], y1 = py[v];
      const n = Math.max(2, Math.ceil(26 * ease));
      ctx.beginPath();
      for (let k = 0; k <= n; k++) {
        const [x, y] = bez(x0, y0, x1, y1, bend, (k / n) * ease);
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = `rgba(${RED},${alpha * 0.22})`; ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = `rgba(${RED},${alpha})`; ctx.lineWidth = 1.4; ctx.stroke();
      if (!atk.landed) {
        const [hx, hy] = bez(x0, y0, x1, y1, bend, ease);
        ctx.fillStyle = `rgba(${RED},1)`;
        ctx.beginPath(); ctx.arc(hx, hy, 2.4, 0, 7); ctx.fill();
      }
    }

    // compromised dots: ring pulse on hit, red marker, then cool off
    for (let i = 0; i < N; i++) {
      const age = t - hitAt[i];
      if (age < 0 || age > HEAL + 2) continue;
      const x = px[i], y = py[i];
      const k = (age < HEAL ? 1 : 1 - (age - HEAL) / 2) * Math.max(0.15, pa[i]);
      if (age < 0.8) {
        const p = age / 0.8;
        ctx.strokeStyle = `rgba(${RED},${(1 - p) * 0.9})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(x, y, 4 + p * 14, 0, 7); ctx.stroke();
      }
      ctx.strokeStyle = `rgba(${RED},${0.55 * k})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.stroke();
      ctx.fillStyle = `rgba(${RED},${0.95 * k})`;
      ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill();
    }
  }

  const elHit = document.getElementById('nHit'), elArcs = document.getElementById('nArcs');
  let uiTick = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * speed;
    last = now;
    if (!paused) step(dt);
    draw();
    if ((uiTick++ & 7) === 0) {
      elHit.textContent = hitCount.toLocaleString();
      elArcs.textContent = attacks.length;
    }
    requestAnimationFrame(frame);
  }

  document.getElementById('pause').addEventListener('click', e => {
    paused = !paused; e.currentTarget.textContent = paused ? 'Resume' : 'Pause';
  });
  document.getElementById('restart').addEventListener('click', () => { t = 0; build(); });
  const bind = (id, fmt, set) => {
    const el = document.getElementById(id), out = document.getElementById(id + 'Out');
    el.addEventListener('input', () => { set(+el.value); out.textContent = fmt(+el.value); });
  };
  bind('speed', v => v.toFixed(2) + '×', v => { speedVal = v; speed = v * (reduced ? 0.4 : 1); });
  bind('tilt', v => Math.round(v) + '°', v => tiltDeg = v);
  bind('reach', v => v.toFixed(1) + '×', v => reachVal = v);
  bind('speedReach', v => v.toFixed(2), v => speedBoost = v);
  bind('maxArcs', v => v > 500 ? '∞' : String(v), v => MAX_ARCS = v > 500 ? Infinity : v);
  bind('double', v => Math.round(v * 100) + '%', v => DOUBLE_P = v);
  bind('balance', v => v.toFixed(1), v => balanceVal = v);
  const sliderPanel = document.getElementById('sliderPanel');
  document.getElementById('toggleSliders').addEventListener('click', e => {
    const willShow = sliderPanel.hidden;
    sliderPanel.hidden = !willShow;
    e.currentTarget.setAttribute('aria-expanded', String(willShow));
    e.currentTarget.textContent = willShow ? 'Hide sliders' : 'Show sliders';
  });
  let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(build, 150); });

  build();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
