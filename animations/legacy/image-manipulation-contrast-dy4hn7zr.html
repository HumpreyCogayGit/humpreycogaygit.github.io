<span id="AdjustmentValueLabel">Contrast Adjustment Value</span><br />
<input type="range" id="adjustmentValue" value="0" min=-200 max=200 step=10>
<br />
<button onclick="AdjustContrast()">Apply Adjustment</button>
<br /><br />
<canvas id="CanvasOR" width="700" height="300"></canvas><canvas id="CanvasOutput" width="700" height="300"></canvas>

<script>//resources
//https://docs.opencv.org/2.4/doc/tutorials/core/basic_linear_transform/basic_linear_transform.html
//http://www.dfstudios.co.uk/articles/programming/image-programming-algorithms/image-processing-algorithms-part-5-contrast-adjustment/

function AdjustContrast()
{
		drawGraphics(parseInt(document.getElementById("adjustmentValue").value));
    
}


function drawGraphics(adjustment) {
//Image Copyright by: HumpreyCogay
//https://docs.rainmeter.net/tips/colormatrix-guide/
	 
    var canvasOR = document.getElementById('CanvasOR');
    var canvasBW = document.getElementById('CanvasOutput');

    var contextOR = canvasOR.getContext('2d');
    var contextBW = canvasBW.getContext('2d');
    
    var imageObj = new Image();


		//Allow CrossOrigin Processing and Reference Image Source
		imageObj.setAttribute('crossOrigin', '');
		imageObj.src = 'images/legacy-photo-23405988.jpg';
	
		imageObj.onload = function() {
    	//Draw Original
      contextOR.drawImage(imageObj, 0, 0, 700, imageObj.height * (700/imageObj.width));
      
      //Draw Output PlaceHolder
      contextBW.drawImage(imageObj, 0, 0, 700, imageObj.height * (700/imageObj.width));
      
			//get image pixel data
      var imgd = contextBW.getImageData(0, 0, 700, imageObj.height * (700/imageObj.width));
      var imageData = imgd.data;
		  var factor = (259 * (adjustment + 255)) / (255 * (259 - adjustment));
  
			//loop per pixel data add adjustment value to RGB
      for (var c = 0, l = imageData.length; c < l; c += 4) {
          imageData[c ] += factor * (imageData[c ] -128) + 128; // replace red
          imageData[c+1] +=  factor * (imageData[c+1] -128) + 128; // replace green
          imageData[c+2] +=  factor * (imageData[c+2] -128) + 128; // replace blue
    }
    
    
    
    
      //update BW context
      contextBW.putImageData(imgd, 0, 0);
	}
}




</script>
</body></html>
