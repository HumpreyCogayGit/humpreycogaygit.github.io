<header class="archive-bar"><a href="../../animations.html">← Animations and Graphics</a><span>Spirograph Exer2(Animate) · <time datetime="2016-08-17T15:03:50">2016-08-17</time></span></header>

    <div id="mainDiv">
        <canvas id="mainStage" width="600" height="600">
            Your browser does not support canvas. Please try again with a different browser.
        </canvas>
    </div>


<script>    var animationGlobalId, fps, startTime, currentTime, previousTime, elapsedTime;
    var r1=70;
    var r2=49;
    var ctx;
    var c=0;
    var theta=0;
    var maxIterations=2520;
    var polyXPoints = [];
    var polyYPoints = [];
    
    function init() {
        var canvas = document.getElementById("mainStage");
        ctx = canvas.getContext("2d");
        
        //compute and collect all x and y coordinates
        for (var c = 0; c <= maxIterations; c++) {
        	//convert angle to radians
            theta = c*Math.PI/180;
            
            //compute x and y coords
            polyXPoints.push((600-r1*2)/2  + (r1-r2* Math.cos(theta) - r2 * Math.cos(((r1/r2)-1) * theta)));
            polyYPoints.push((600-r1*2)/2  + (r1-r2* Math.sin(theta) - r2 * Math.sin(((r1/r2)-1) * theta )));
        }
        
    	//start animation
        startAnimation(100);    
    }
	
     function startAnimation(fps) {
        fpsInterval = 1000 / fps;
        previousTime = Date.now();
        startTime = previousTime;
        animate();
     }
    
    function animate() { 
    	//trap if max iterations reached
        if (c>=maxIterations) {
            alert('Animation Done');
            return;
        }
        
        //request Animation Frame and get Global ID(Can be used to stop/start animation)
        animationGlobalId = requestAnimationFrame(animate);
        currentTime = Date.now();
        elapsedTime = currentTime - previousTime;
      
      	
        if (elapsedTime > fpsInterval) {
            previousTime = currentTime - (elapsedTime % fpsInterval);
            
            //skip 5 steps to make animation faster
            c +=5;            
			//Draw
            ctx.fillStyle ='Brown';
            ctx.fillRect(polyXPoints[c],polyYPoints[c],2,2);         
        }
    }
window.addEventListener("load", function () { init() });</script>
</body></html>
