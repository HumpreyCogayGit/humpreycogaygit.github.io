<script>function init() {
    var canvas = document.getElementById("mainStage");
    var ctx = canvas.getContext("2d");
    drawGraphics(ctx);
}

function drawGraphics(ctx) {
    //initialized beauty :)
    var theta = 0;
    var radius = 200;

    //	cx and cy - center point for the invisible main circle
    var cx = 500 / 2;
    var cy = 500 / 2;

    // dv - no of points on the circumference
    var dv = 30;
    //  lw - stroke size of the visible mini circle
    var lw = .5;

    //x and y coordinates placeholder
    var polyXPoints = [];
    var polyYPoints = [];

    //effects
    var offset1 = 9;
    var offset2 = 13;
    
    //Generate X and Y Point 
    for (var c = 0; c <= dv - 1; c++) {
        polyXPoints.push(cx + radius * (Math.cos((c * 360 / dv) * Math.PI / 180)));
        polyYPoints.push(cy + radius * (Math.sin((c * 360 / dv) * Math.PI / 180)));
    }

    //Connect all Points
    for (c = 0; c <= dv - 1; c++) {
        for (var y = c+offset1; y <=c+offset2 ; y++) {
            ctx.beginPath();
            ctx.moveTo(polyXPoints[c], polyYPoints[c]);

            if (y <= dv-1)
                ctx.lineTo(polyXPoints[y], polyYPoints[y]);
            else
                ctx.lineTo(polyXPoints[y-dv], polyYPoints[y-dv]);

            ctx.lineWidth = lw;
            
            //random color
            // 16777215 is ffffff in base 10
            ctx.strokeStyle = '#' + Math.floor(Math.random() * 16777215).toString(16);
            ctx.stroke();
        }
    }

}

window.addEventListener("load", function () { init() });</script>
