    Outer Gear Size
    <input type="range" id="RadiusOuter" value="117" min=1 max=400 step=1>

    Inner Gear Size
    <input type="range" id="RadiusInner" value="96" min=1 max=400 step=1>

    <br />
    <input id="generateSpiroGraph" type="button" value="Generate Spirograph">

    <div id="mainDiv">
        <canvas id="mainStage" width="600" height="600">
            Your browser does not support canvas. Please try again with a different browser.
        </canvas>
    </div>


<script>function init() {
    var canvas = document.getElementById("mainStage");
    var ctx = canvas.getContext("2d");

    $('#RadiusOuterValue').html($(RadiusOuter).val());
    $('#RadiusInnerValue').html($(RadiusInner).val());
    $(document).on('input', '#RadiusOuter', function() {
        //drawGraphics(ctx,$('#RadiusOuter').val(),$('#RadiusInner').val);
        $('#RadiusOuterValue').html($(this).val());
    });

    $(document).on('input', '#RadiusInner', function() {
        $('#RadiusInnerValue').html($(this).val());
    });

    $('#generateSpiroGraph').click(function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGraphics(ctx, $('#RadiusOuter').val(), $('#RadiusInner').val());
    });
}

function drawGraphics(ctx, r1, r2) {
    var xpos = 0;
    var ypos = 0;
    var theta = 0;

    for (var c = 1; c <= r2*360; c++) {    
    	//convert angles to radians
        theta = c * Math.PI / 180;
        
        //compute x and y coordinates
        xpos = (600 - r1 * 2) / 2 + (r1 - r2 * Math.cos(theta) - r2 * Math.cos(((r1 / r2) - 1) * theta));
        ypos = (600 - r1 * 2) / 2 + (r1 - r2 * Math.sin(theta) - r2 * Math.sin(((r1 / r2) - 1) * theta));
        
        //draw a new point.
        ctx.fillStyle = 'red';
        ctx.fillRect(xpos, ypos, .3, .3); // fill in the pixel at (10,10)
    }
}

window.addEventListener("load", function () { init() });</script>
