    <img id="imagePixCulated" src="images/legacy-photo-23415159.jpg"  crossorigin="anonymous" />


<script>//Image by Humprey Cogay
//images/legacy-photo-23415159.jpg
//images/legacy-photo-23415159.jpg
  function init() {
    document.getElementById('imagePixCulated').PixCulate([
            { resolution : 10, size: 9 }
        ]);
    };
    window.addEventListener( 'load', init, false);

   ( function( window, undefined ) {
    function PixCular( img, options ) {
        this.img = img
				
        //reference Canvas
        var canvas = this.canvas = document.createElement('canvas')

        //Reference Context
        this.ctx = canvas.getContext('2d')

        //set Canvas Class Name  and Canvas ID 
        canvas.className = img.className
        canvas.id = img.id
        
        this.render( options )
        
        img.parentNode.replaceChild( canvas, img )
    }
   
    PixCular.prototype.render = function( options ) {
        this.options = options
        //Get Dimensions
        var w = this.width = this.canvas.width = this.img.width
        var h = this.height = this.canvas.height = this.img.height
        this.img.setAttribute('crossOrigin', '');

        //Draw Image on Canvas
        this.ctx.drawImage( this.img, 0, 0 )
				
        //Get Image Data before Processing
        this.imgData = this.ctx.getImageData( 0, 0, w, h ).data

        //Clear canvas 
        this.ctx.clearRect( 0, 0, w, h )

        //Render Circles
        for ( var i=0, len = options.length; i < len; i++ ) {
            this.renderCircles( options[i] )
        }
    }
   
   PixCular.prototype.renderCircles = function( opts ) {
        //Dimensions
        var w = this.width
        var h = this.height

        //Context and Image Data
        var ctx = this.ctx
        var imgData = this.imgData
   
        var res = opts.resolution
        var size = opts.size 
        var alpha = 1

        var cols = w / res + 1
        var rows = h / res + 1        
        var row
        var col
        var x
        var y
        var pixelY
        var pixelX
        var pixelIndex
        var redChannel
        var greenChannel
        var blueChannel
        var alphaChannel

        for ( row = 0; row < rows; row++ ) {
            //Compute Y Coord
            y = ( row - 0.5 ) * res 
            pixelY = Math.max( Math.min( y, h-1), 0)
            for ( col = 0; col < cols; col++ ) {
                //Compute X Coord
                x = ( col - 0.5 ) * res 
                pixelX = Math.max( Math.min( x, w-1), 0)
                pixelIndex = ( pixelX + pixelY * w ) * 4

                //Set Circle Channels Before Drawing 
                redChannel   = imgData[ pixelIndex + 0 ]
                greenChannel = imgData[ pixelIndex + 1 ]
                blueChannel  = imgData[ pixelIndex + 2 ]
                alphaChannel = alpha * ( imgData[ pixelIndex + 3 ] / 255)
                
                //Draw circles based on image data Average Color 
                ctx.fillStyle = 'rgba(' + redChannel +','+ greenChannel +','+ blueChannel +','+ alphaChannel + ')'
                ctx.beginPath()
                ctx.arc ( x, y,  size / 2, 0, Math.PI * 2, true )
                ctx.fill()
                ctx.closePath()
                } 
            } 
        }

   HTMLImageElement.prototype.PixCulate = function ( options ) {
     return new PixCular( this, options )
   }
   
   // put in global namespace
   window.PixCular = PixCular
   
   })( window );</script>
