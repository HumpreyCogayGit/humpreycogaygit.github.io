<div id="container">
        <div id="ground"></div>
        <div id="rabbit"></div>
    </div>
<script>const rabbit1 = `   (\\___/)
   (='.'=)
   (")_(")`;

        const rabbit2 = `   (\\___/)
   (o'.'o)
   (")_(")`;

        const rabbitFrames = [rabbit1, rabbit2];
        const rabbitEl = document.getElementById('rabbit');
        const container = document.getElementById('container');
        
        let position = 0;
        let frameIndex = 0;
        let direction = 1;
        let jumpPhase = 0;
        let isGrounded = true;
        let groundTimer = 0;
        
        function animate() {
            // Update frame only when moving
            if (!isGrounded || groundTimer === 0) {
                rabbitEl.textContent = rabbitFrames[frameIndex];
                frameIndex = (frameIndex + 1) % rabbitFrames.length;
            }
            
            // Handle ground pause
            if (isGrounded) {
                groundTimer++;
                if (groundTimer > 6) { // Pause for ~0.9 seconds on ground
                    isGrounded = false;
                    groundTimer = 0;
                    jumpPhase = 0;
                }
            } else {
                // Update jump phase for vertical movement
                jumpPhase += 0.5;
                
                // Calculate vertical offset with proper easing
                const jumpHeight = 70;
                const jumpDuration = Math.PI;
                
                let verticalOffset = 0;
                if (jumpPhase < jumpDuration) {
                    // Normalized time from 0 to 1
                    const t = jumpPhase / jumpDuration;
                    
                    // Gravity-based easing: quick rise, faster fall
                    let easedT;
                    if (t < 0.4) {
                        // Rising: ease-out quad (quick explosive jump)
                        const t2 = t / 0.4;
                        easedT = 1 - Math.pow(1 - t2, 2);
                        easedT = easedT * 0.5;
                    } else {
                        // Falling: ease-in quad (gravity acceleration)
                        const t2 = (t - 0.4) / 0.6;
                        easedT = 0.5 + (Math.pow(t2, 2) * 0.5);
                    }
                    
                    // Apply parabolic arc with easing
                    verticalOffset = jumpHeight * Math.sin(easedT * Math.PI);
                } else {
                    // Landed
                    verticalOffset = 0;
                    isGrounded = true;
                }
                
                // Apply position with jumping motion
                rabbitEl.style.bottom = (80 + verticalOffset) + 'px';
            }
            
            // Update horizontal position ONLY when in the air
            if (!isGrounded) {
                position += direction * 4;
            }
            
            // Get container and rabbit widths
            const containerWidth = container.offsetWidth;
            const rabbitWidth = 80;
            
            // Reverse direction at edges
            if (position >= containerWidth - rabbitWidth) {
                direction = -1;
            } else if (position <= 0) {
                direction = 1;
            }
            
            // Apply horizontal position and flip for direction
            rabbitEl.style.left = position + 'px';
            rabbitEl.style.transform = `scaleX(${direction})`;
        }
        
        // Start animation
        setInterval(animate, 150);</script>
