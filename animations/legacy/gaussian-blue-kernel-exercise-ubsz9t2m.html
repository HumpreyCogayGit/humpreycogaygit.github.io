    SIGMA<input id="sigma" type="text" value="15"/>
    DIMENSION<input id="dimension" type="text" value="20" />
    <button onclick="start()">Apply Gaussian Function</button>
     <h4>Original Image</h4>
      
      <img src='images/legacy-photo-42887248.jpg'>
      <h4>Blur Image via Guassian Blur Algo</h4>
      <canvas id="canvas" width=1280 height=616></canvas>
    
    <h1>Kernel</h1>
    <ul id="list"></ul>
    
     
  
  

  
<script>      // load an image 
      var image = new Image();
		  var majorKernel;
      //Allow cross anonymous origin 
      image.crossOrigin = 'anonymous';
      image.onload = start;
      image.src = "images/legacy-photo-42887248.jpg";


      function start() {
 				
				var kernelArray = computeKernel();
       
         var kernel = pixelFun.convolute(pixelFun.getPixels(image,'canvas'),kernelArray,0);

          var processedImage = pixelFun.createImageData(kernel.width, kernel.height);

          for (var i = 0; i < processedImage.data.length; i += 4) {
               processedImage.data[i] = kernel.data[i];
               processedImage.data[i+1] = kernel.data[i+1];
               processedImage.data[i+2] = kernel.data[i+2];
               processedImage.data[i + 3] = 255; 
           }

          // put the filtered imageData on an in-memory canvas
          var memCanvas = document.createElement('canvas');
          memCanvas.width = image.width;
          memCanvas.height = image.height;
          memCanvas.getContext('2d').putImageData(processedImage, 0, 0);

          // Display the processed image on the visible canvas.
          var canvas = document.getElementById('canvas');
          canvas.width = image.width;
          canvas.height = image.height;
          canvas.getContext('2d').drawImage(memCanvas, 0, 0);
      }

      //Create an Empty Object
      pixelFun = new Object();
      
      //Get Image Data from Canvas
      pixelFun.getPixels = function (image,targetCanvasName) {
          var tmpCanvas, tmpContext;
          tmpCanvas = document.createElement(targetCanvasName);

          tmpCanvas.width = image.width;
          tmpCanvas.height = image.height;
          
          tmpContext = tmpCanvas.getContext('2d');
          tmpContext.drawImage(image, 0, 0);
          
          return tmpContext.getImageData(0, 0, tmpCanvas.width, tmpCanvas.height);
      };

      //Canvas Placeholder
      pixelFun.tmpCanvas = document.createElement('canvas');

      //Context placeholder
      pixelFun.tmpCtx = pixelFun.tmpCanvas.getContext('2d');

      //Get Context Image Data
      pixelFun.createImageData = function (width, height) {
          return this.tmpCtx.createImageData(width, height);
      };

      //Convolute Function
      pixelFun.convolute = function (pixels, weights, opaque) {
          var side = Math.round(Math.sqrt(weights.length));
          var part = Math.floor(side / 2);

          var src = pixels.data;
          var sw = pixels.width;
          var sh = pixels.height;

          var width = sw;
          var height = sh;

          var output = {
              width: width, height: height, data: new Float32Array(width * height * 4)
          };
          var tmp = output.data;
          
          var alphaFac = opaque ? 1 : 0;
          
          var divConstant = Math.floor(computeKernelTotal(weights));
          
          for (var vCounter = 0; vCounter < height; vCounter++) {
              for (var hCounter = 0; hCounter < width; hCounter++) {
                  var kvCounter = vCounter;
                  var khCounter = hCounter;
                  var offset = (vCounter * width + hCounter) * 4;
                  var r = 0, g = 0, b = 0, a = 0;
                  for (var kv = 0; kv < side; kv++) {
                      for (var kh = 0; kh < side; kh++) {
                          var y = Math.min(sh - 1, Math.max(0, kvCounter + kv - part));
                          var x = Math.min(sw - 1, Math.max(0, khCounter + kh - part));
                          var srcOff = (y * sw + x) * 4;
                          var weightedAverage = weights[kv * side + kh];
                          r += src[srcOff] * weightedAverage;
                          g += src[srcOff + 1] * weightedAverage;
                          b += src[srcOff + 2] * weightedAverage;
                          a += src[srcOff + 3] * weightedAverage;
                      }
                  }
                  tmp[offset] = r/divConstant;
                  tmp[offset + 1] = g/divConstant;
                  tmp[offset + 2] = b/divConstant;
                  tmp[offset + 3] = a + alphaFac * (255 - a);
              }
          }
          return output;
      };


function computeRescaleFactor(k){
		var rescaleFactor = 1/k[0];
    return Math.floor(rescaleFactor);
}

function computeKernelTotal(x){
		var kernelTotal =0;
    //var rescaleFactor = computeRescaleFactor(x);
		x.forEach(function (element) {
        kernelTotal=kernelTotal+(element);
    });
    
    return  Math.floor(kernelTotal);
}


function rescaleKernel(k){
		var rescaleFactor = computeRescaleFactor(k);
		k.forEach(function (element,index) {
        k[index]+=element*rescaleFactor;
    });
    return k;
}

function computeKernel() {
    var sig = document.getElementById("sigma").value; 
    var dim = document.getElementById("dimension").value; 
    var kernel = GenerateKernel(dim, sig);
    majorKernel = rescaleKernel(kernel);
    //UNCOMMENT BELOW TO GET THE KERNEL 
		document.getElementById("list").innerHTML = "";
    kernel.forEach(function (element) {
        var ul = document.getElementById("list");
        var li = document.createElement("li");
        li.appendChild(document.createTextNode(parseFloat(element).toFixed(0)));
        ul.appendChild(li);
    });
    
    return majorKernel;
}

function GenerateKernel(dim, sig) {
    var kernel = [];
    var z = Math.pow(sig, 2) * 2;
    var midPoint = (dim - 1) / 2;
    for (var i = 0; i < dim; i++) {
        for (var j = 0; j < dim; j++) {
            var distance = computeDistance(i, j, midPoint, midPoint);
            var gaussian = (1 / Math.sqrt(Math.PI * z)) * Math.exp((-1) * (Math.pow(distance, 2) / z));
            kernel.push(gaussian);
        }
    }
    var sum = kernel.reduce(function (a, b) { return a + b; });
    return kernel.map(function (e) { return e / sum; });
}

function computeDistance(x1, y1, x2, y2) {
    var x = Math.pow(x1 - x2, 2);
    var y = Math.pow(y1 - y2, 2);
    return Math.sqrt(x + y);
}
</script>
