    <canvas id="mainStage" width="500" height="500">

    </canvas>

<script>function init() {
    var canvas = document.getElementById("mainStage");
    var ctx = canvas.getContext("2d");
    drawGraphics(ctx);
}

function drawGraphics(ctx) {
	//initialized beauty :)
    var radius = 100;
	
    //	cx and cy - center point for the invisible main circle
	var cx = 500 / 2;
    var cy = 500 / 2;
    
    //  r - radius of the visible mini circle
    var r = 100;
    
    // dv - no of points on the circumference
    var dv = 48;
    //  lw - stroke size of the visible mini circle
    var lw = .3;
    
    //  sc - stroke color of the visible mini circle
    var sc = 'Green';

	// delay
	var d =100;
    var c = 0;
    
    var delayRoutine = function(c) {
        c = c || 0;
        //loop
      	//the circumference will be divided equally
        //get the exact point where the circumference is divided
        //Edit dv variable to increase division
        if (c <= dv-1) {
        	//https://en.wikipedia.org/wiki/Circle#Equations
            //x = cx + radius * cos(angle)
            //y = cy + radius * sin(angle)
            
			// Compute px and py - current positions for the visible mini circle	
            // Math.cos and Math.sin takes radians instead of degrees,
            // so we need to convert 
            // Radians = degress * pi / 100
            var px = cx + radius * (Math.cos((c*360/dv)*Math.PI/180));
            var py = cy + radius * (Math.sin((c*360/dv)*Math.PI/180)); 

            //Drace a circle on the newly computed coordinate            
            drawCircle(ctx, px, py, r  ,lw, sc);
            //ctx.fillRect(px,py,10,10)
            
            //Increase counter
            c++;
            
            setTimeout(function() {
                delayRoutine(c)
            }, d);
        }
    }
    delayRoutine();
    
    function drawCircle(ctx, px, py, r,lw,sc) {
        //Begin Path
        ctx.beginPath();
        //Create a circle
        ctx.arc(px, py, r, 0, 2 * Math.PI, false);
        //Draw Stroke
        ctx.lineWidth = lw;
        ctx.strokeStyle = sc;
        ctx.stroke();
    }
}
window.addEventListener("load", function () { init() });</script>
