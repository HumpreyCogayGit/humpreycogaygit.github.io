      <h4>Original Image</h4>
      
      <img id="sourceImage" src='images/legacy-photo-23415159.jpg'>
      <h4>Sharpen Image via Convolution</h4>
      <canvas id="canvas" width=1280 height=616></canvas>
  
  

  
<script>const image = document.getElementById('sourceImage');


function start() {
  const original = pixelFun.getPixels(image);
  const blurred = pixelFun.convolute(original, gaussian7x7);

  const width = original.width;
  const height = original.height;
  const output = pixelFun.createImageData(width, height);

  const amount = 1.5; // Sharpening strength

  for (let i = 0; i < original.data.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const highPass = original.data[i + c] - blurred.data[i + c];
      const sharpened = original.data[i + c] + amount * highPass;
      output.data[i + c] = Math.min(255, Math.max(0, sharpened));
    }
    output.data[i + 3] = 255; // full alpha
  }

  const memCanvas = document.createElement('canvas');
  memCanvas.width = width;
  memCanvas.height = height;
  memCanvas.getContext('2d').putImageData(output, 0, 0);

  const canvas = document.getElementById('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(memCanvas, 0, 0);
}

const pixelFun = {};

pixelFun.getPixels = function (image) {
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = image.width;
  tmpCanvas.height = image.height;
  const ctx = tmpCanvas.getContext('2d');
  ctx.drawImage(image, 0, 0);
  return ctx.getImageData(0, 0, tmpCanvas.width, tmpCanvas.height);
};

pixelFun.tmpCanvas = document.createElement('canvas');
pixelFun.tmpCtx = pixelFun.tmpCanvas.getContext('2d');

pixelFun.createImageData = function (width, height) {
  return this.tmpCtx.createImageData(width, height);
};

pixelFun.convolute = function (pixels, weights, opaque = false) {
  const side = Math.round(Math.sqrt(weights.length));
  const halfSide = Math.floor(side / 2);
  const src = pixels.data;
  const sw = pixels.width;
  const sh = pixels.height;
  const w = sw, h = sh;
  const output = pixelFun.createImageData(w, h);
  const dst = output.data;
  const weightSum = weights.reduce((a, b) => a + b, 0);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let r = 0, g = 0, b = 0, a = 0;
      for (let cy = 0; cy < side; cy++) {
        for (let cx = 0; cx < side; cx++) {
          const scy = Math.min(sh - 1, Math.max(0, y + cy - halfSide));
          const scx = Math.min(sw - 1, Math.max(0, x + cx - halfSide));
          const srcOffset = (scy * sw + scx) * 4;
          const wt = weights[cy * side + cx];
          r += src[srcOffset] * wt;
          g += src[srcOffset + 1] * wt;
          b += src[srcOffset + 2] * wt;
          a += src[srcOffset + 3] * wt;
        }
      }
      const dstOffset = (y * w + x) * 4;
      dst[dstOffset] = r / weightSum;
      dst[dstOffset + 1] = g / weightSum;
      dst[dstOffset + 2] = b / weightSum;
      dst[dstOffset + 3] = a / weightSum + (opaque ? 255 - a / weightSum : 0);
    }
  }
  return output;
};

const gaussian7x7 = [
  0, 0, 1, 2, 1, 0, 0,
  0, 3, 13, 22, 13, 3, 0,
  1, 13, 59, 97, 59, 13, 1,
  2, 22, 97, 159, 97, 22, 2,
  1, 13, 59, 97, 59, 13, 1,
  0, 3, 13, 22, 13, 3, 0,
  0, 0, 1, 2, 1, 0, 0
];

if (image.complete) { start(); } else { image.onload = start; }</script>
