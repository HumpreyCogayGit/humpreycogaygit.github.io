<script>//Notes: 
//Inspired by original code of 
//  Richard Eric Montero Lope - https://www.facebook.com/AnyaBasic
//  Author of Anya Basic - https://github.com/relminator/AnyaBasic
//  References - Sunflowers and Fibonacci - https://thatsmaths.com/2014/06/05/sunflowers-and-fibonacci-models-of-efficiency/

function init() {
    var canvas = document.getElementById("mainStage");
    var ctx = canvas.getContext("2d");
    drawGraphics(ctx);
}

function drawGraphics(ctx) {
	//initialized beauty :)
    var theta = 0;
    var radius = 600;
	
    //	cx and cy - center point for the invisible main circle
	var cx = 500 / 2;
    var cy = 500 / 2;
    
    //  r - radius of the visible mini circle
    var r = 7;
    
    //  lw - stroke size of the visible mini circle
    var lw = .3;
    
    //  sc - stroke color of the visible mini circle
    var sc = 'Brown';
    
    //  rg1 and rg2 - radial gradient for the visible mini circle
    var rg1 = 1;
    var rg2 = 10;
    
    //  rc1 and rc2 - radial colors
    var rc1 = 'Yellow';
    var rc2 = 'Green';
    
	// delay
	var d = 10;
	
    var delayRoutine = function(c) {
        c = c || 0;
        
        //loop
        if (c < 1375) {

            //Golden Angle
            theta += 137.5;

            //radius of main base invisible circle 
            radius += Math.sqrt(c);

			//  Compute px and py - current positions for the visible mini circle	
            var px = parseInt(cx + (Math.cos(theta * Math.PI / 180) * radius) / 150);
            var py = parseInt(cy + (Math.sin(theta * Math.PI / 180) * radius) / 150);

            //Drace a circle on the newly computed coordinate            
            drawCircle(ctx, px, py, r,lw, sc,rg1, rg2, rc1, rc2);
            
            //Increase counter
            c++;
            
            setTimeout(function() {
                delayRoutine(c)
            }, d);
        }
    }
    delayRoutine();

    function drawCircle(ctx, px, py, r,lw,sc,rg1,rg2,rc1,rc2) {
    
    	//Prepare Gradient
        var grd = ctx.createRadialGradient(px, py, rg1, px, py, rg2);
        grd.addColorStop(0, rc1);
        grd.addColorStop(1, rc2);
        
        //Begin Path
        ctx.beginPath();
        
        //Create a circle
        ctx.arc(px, py, r, 0, 2 * Math.PI, false);
        
        //Draw Fill
        ctx.fillStyle = grd;
        ctx.fill();
        
        //Draw Stroke
        ctx.lineWidth = lw;
        ctx.strokeStyle = sc;
        ctx.stroke();
    }
}


window.addEventListener("load", function () { init() });</script>
