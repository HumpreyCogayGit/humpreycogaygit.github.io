  <div id="mainDiv">

    </canvas>

<script>function init() {
  var canvas = document.getElementById("mainStage");
  var ctx = canvas.getContext("2d");

  $('#RadiusOuterValue').html($(RadiusOuter).val());
  $('#RadiusInnerValue').html($(RadiusInner).val());
  $('#PenPositionValue').html($(PenPosition).val());

  $(document).on('input', '#RadiusOuter', function() {
    //drawGraphics(ctx,$('#RadiusOuter').val(),$('#RadiusInner').val);
    $('#RadiusOuterValue').html($(this).val());
  });

  $(document).on('input', '#RadiusInner', function() {
    $('#RadiusInnerValue').html($(this).val());
  });

  $(document).on('input', '#PenPosition', function() {
    $('#PenPositionValue').html($(this).val());
  });

  $('#generateSpiroGraph').click(function() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGraphics(ctx,
      $('#RadiusOuter').val(),
      $('#RadiusInner').val(),
      $('#PenPosition').val());
  });
}

function drawGraphics(ctx, r1, r2, penPosition) {
  var xpos = 0;
  var ypos = 0;
  var xposPrevious = 0;
  var yposPrevious = 0;
  var theta = 0;


  for (var c = 0; c <= 360; c++) {
    //convert angles to radians
    theta = c * Math.PI / 180;

    console.log(xpos + '---' + ypos);
    //compute x and y coordinates
    xpos = 300 + (r1 - r2) * Math.cos(theta) - penPosition * Math.cos((r1 + r2) * theta / r2)
    ypos = 300 + (r1 - r2) * Math.sin(theta) - penPosition * Math.sin((r1 + r2) * theta / r2)


    //draw a new point.
    //ctx.fillStyle = 'red';
    //ctx.fillRect(xpos, ypos, .3, .3); // fill in the pixel at (10,10)
    if (xposPrevious != 0) {
      ctx.beginPath();
      ctx.moveTo(xpos, ypos);
      ctx.lineWidth = .1;
      ctx.lineTo(xposPrevious, yposPrevious);
      ctx.stroke();
    }
    xposPrevious = xpos;
    yposPrevious = ypos;
  }
}

window.addEventListener("load", function () { init() });</script>
