<script>function init() {
    var canvas = document.getElementById("mainStage");
    var ctx = canvas.getContext("2d");
    drawGraphics(ctx);
}

function drawGraphics(ctx) {
    //initialized beauty :)
    var theta = 0;
    var radius = 200;

    //	cx and cy - center point for the invisible main circle
    var cx = 500 / 2;
    var cy = 500 / 2;

    // dv - no of points on the circumference
    var dv = 12;
    //  lw - stroke size of the visible mini circle
    var lw = .3;

    //  sc - stroke color of the visible mini circle
    var sc = 'Brown';

	// x and y Axis holder
    var polyXPoints = [];
    var polyYPoints = [];

    //Generate X and Y Point 
    for (var c = 0; c <= dv - 1; c++) {
        polyXPoints.push(cx + radius * (Math.cos((c * 360 / dv) * Math.PI / 180)));
        polyYPoints.push(cy + radius * (Math.sin((c * 360 / dv) * Math.PI / 180)));
    }

    //Connect all Points
    for (var c1 = 0; c1 <= dv - 1; c1++) {
        for (var c2 = 0; c2 <= dv - 1; c2++) {
            ctx.beginPath();
            ctx.moveTo(polyXPoints[c1], polyYPoints[c1]);

            if (c2 != dv - 1)
                ctx.lineTo(polyXPoints[c2 + 1], polyYPoints[c2 + 1]);
            else
                ctx.lineTo(polyXPoints[0], polyYPoints[0]);

            ctx.lineWidth = lw;
            ctx.strokeStyle = sc;
            ctx.stroke();
        }
    }

}

window.addEventListener("load", function () { init() });</script>
